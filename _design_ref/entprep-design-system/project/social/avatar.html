<!-- @dsCard group="Brand" viewport="700x360" name="Social avatar — book + bolt" subtitle="ENTprep mark for Instagram & TikTok (1080×1080)" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ENTprep — Avatar</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; background: #ECE3D2; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 44px 40px 72px; }
  h1 { margin: 10px 0 4px; }
  .row { display: flex; align-items: center; gap: 40px; margin-top: 34px; flex-wrap: wrap; }
  .stack { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .sq { width: 260px; height: 260px; border-radius: 20px; overflow: hidden; border: 2px solid var(--ink); box-shadow: var(--shadow-rest); }
  .sq img { width: 100%; height: 100%; display: block; }
  .circ { width: 168px; height: 168px; border-radius: 50%; overflow: hidden; border: 2px solid var(--ink); box-shadow: var(--shadow-rest); }
  .circ img { width: 100%; height: 100%; display: block; }
  .small { width: 64px; height: 64px; border-radius: 50%; overflow: hidden; border: 2px solid var(--ink); }
  .small img { width: 100%; height: 100%; display: block; }
  .lbl { font-family: var(--ff-mono); font-size: 10px; font-weight: 700; color: var(--text-faint); letter-spacing: 0.1em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="t-eyebrow" style="color:var(--streak)">• ENTprep · профиль •</div>
    <h1 class="t-h1">Аватар — книга + молния</h1>
    <p class="t-body" style="margin:0;max-width:560px;color:var(--text-muted)">
      Знак на жёлтом фоне: белая раскрытая книга и оранжевая молния, жирные
      ink-контуры, плоско. 1080×1080, PNG. Показан квадратом и кружком — так его
      обрежут Instagram / TikTok.
    </p>
    <div class="row">
      <div class="stack"><div class="sq"><img src="entprep-avatar.png" alt="ENTprep avatar" /></div><div class="lbl">1080×1080</div></div>
      <div class="stack"><div class="circ"><img src="entprep-avatar.png" alt="" /></div><div class="lbl">круг · профиль</div></div>
      <div class="stack"><div class="small"><img src="entprep-avatar.png" alt="" /></div><div class="lbl">лента</div></div>
    </div>
  </div>
</body>
</html>

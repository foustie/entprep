<!-- @dsCard group="Components" viewport="700x420" name="Quiz — Answers & Subject tiles" subtitle="Answer states and lesson-path tiles" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { padding: 28px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .lbl { font-family: var(--ff-mono); font-size: 10px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; }
</style>
</head>
<body>
  <div class="grid">
    <div>
      <div class="lbl">Answer states</div>
      <div class="col" id="answers"></div>
    </div>
    <div>
      <div class="lbl">Subject tiles</div>
      <div class="col" id="subjects"></div>
    </div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="../../_ds_bundle.js?v=1"></script>
  <script type="text/babel">
    const { AnswerOption, SubjectTile } = window.ENTprepDesignSystem_78ebb6;
    const Ic = ({ n }) => {
      const ref = React.useRef(null);
      React.useEffect(() => { if (ref.current) { ref.current.innerHTML=''; const el = window.lucide.createElement(window.lucide.icons[n]); el.setAttribute('width','22'); el.setAttribute('height','22'); el.setAttribute('stroke','currentColor'); el.setAttribute('stroke-width','2.4'); ref.current.appendChild(el); } }, []);
      return <span ref={ref} style={{ display:'inline-flex' }} />;
    };
    ReactDOM.createRoot(document.getElementById('answers')).render(
      <>
        <AnswerOption marker="А">Функция возрастает</AnswerOption>
        <AnswerOption marker="Б" state="selected">x = 4</AnswerOption>
        <AnswerOption marker="В" state="correct">log₂8 = 3</AnswerOption>
        <AnswerOption marker="Г" state="wrong">x = −1</AnswerOption>
      </>
    );
    ReactDOM.createRoot(document.getElementById('subjects')).render(
      <>
        <SubjectTile icon={<Ic n="Calculator" />} title="Математика" subtitle="320 вопросов" progress={68} accent="var(--xp-soft)" />
        <SubjectTile icon={<Ic n="Atom" />} title="Физика" subtitle="240 вопросов" progress={32} accent="var(--win-soft)" />
        <SubjectTile icon={<Ic n="Lock" />} title="История" subtitle="скоро" locked />
      </>
    );
  </script>
</body>
</html>

<!-- @dsCard group="Components" viewport="700x460" name="Buttons & IconButtons" subtitle="Stamped pressable buttons — variants, sizes, states" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { padding: 28px; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-bottom: 22px; }
  .lbl { font-family: var(--ff-mono); font-size: 10px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; }
</style>
</head>
<body>
  <div class="lbl">Variants</div>
  <div class="row" id="variants"></div>
  <div class="lbl">Sizes</div>
  <div class="row" id="sizes"></div>
  <div class="lbl">With icon · disabled · icon buttons</div>
  <div class="row" id="states"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="../../_ds_bundle.js?v=1"></script>
  <script type="text/babel">
    const { Button, IconButton } = window.ENTprepDesignSystem_78ebb6;
    const Ic = ({ n, c = 'currentColor' }) => {
      const ref = React.useRef(null);
      React.useEffect(() => { if (ref.current) { ref.current.innerHTML = ''; const el = window.lucide.createElement(window.lucide.icons[n]); el.setAttribute('width','18'); el.setAttribute('height','18'); el.setAttribute('stroke', c); el.setAttribute('stroke-width','2.5'); ref.current.appendChild(el); } }, []);
      return <span ref={ref} style={{ display:'inline-flex' }} />;
    };

    ReactDOM.createRoot(document.getElementById('variants')).render(
      <>
        <Button variant="primary">Поехали</Button>
        <Button variant="secondary">Позже</Button>
        <Button variant="ink">Профиль</Button>
      </>
    );
    ReactDOM.createRoot(document.getElementById('sizes')).render(
      <>
        <Button size="sm">Small</Button>
        <Button size="md">Medium</Button>
        <Button size="lg">Large</Button>
      </>
    );
    ReactDOM.createRoot(document.getElementById('states')).render(
      <>
        <Button variant="primary" leadingIcon={<Ic n="Play" c="#fff" />}>Начать квест</Button>
        <Button variant="secondary" disabled>Заблокировано</Button>
        <IconButton ariaLabel="Назад"><Ic n="ArrowLeft" /></IconButton>
        <IconButton variant="primary" ariaLabel="Дальше"><Ic n="ArrowRight" c="#fff" /></IconButton>
        <IconButton variant="ink" ariaLabel="Закрыть"><Ic n="X" c="#fff" /></IconButton>
      </>
    );
  </script>
</body>
</html>

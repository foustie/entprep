<!-- @dsCard group="Type" viewport="700x230" name="Display & Headings — Unbounded" subtitle="Headings and hero numbers; tight negative tracking" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 26px; margin: 0; }
  .spec { display: flex; align-items: baseline; gap: 16px; padding: 10px 0; border-bottom: 1px dashed #d9d0bd; }
  .spec:last-child { border-bottom: 0; }
  .tag { font-family: var(--ff-mono); font-size: 10px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.06em; width: 130px; flex: 0 0 auto; }
</style>
</head>
<body>
  <div class="spec"><span class="tag">display · 30/900</span><span class="t-display">Поехали 🚀</span></div>
  <div class="spec"><span class="tag">h1 · 26/800</span><span class="t-h1">Сегодняшний квест</span></div>
  <div class="spec"><span class="tag">h2 · 18/700</span><span class="t-h2">Разбор ошибок</span></div>
  <div class="spec"><span class="tag">h3 · 14/700</span><span class="t-h3">Математика · Алгебра</span></div>
</body>
</html>

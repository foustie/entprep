<!-- @dsCard group="Type" viewport="700x230" name="Mono — JetBrains Mono" subtitle="Eyebrows, stat labels and any changing number (tabular)" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 26px; margin: 0; }
  .spec { display: flex; align-items: baseline; gap: 16px; padding: 12px 0; border-bottom: 1px dashed #d9d0bd; }
  .spec:last-child { border-bottom: 0; }
  .tag { font-family: var(--ff-mono); font-size: 10px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.06em; width: 150px; flex: 0 0 auto; }
</style>
</head>
<body>
  <div class="spec"><span class="tag">eyebrow · 10/800</span><span class="t-eyebrow">• ЕНТ 2026 •</span></div>
  <div class="spec"><span class="tag">stat-label · 10/700</span><span class="t-stat-label">дней подряд</span></div>
  <div class="spec"><span class="tag">stat · 32/800 tabular</span><span class="t-stat" style="color:var(--streak)">12</span></div>
  <div class="spec"><span class="tag">number · tabular-nums</span><span class="tabular" style="font-family:var(--ff-mono);font-weight:700;font-size:18px">1 240 XP</span></div>
</body>
</html>

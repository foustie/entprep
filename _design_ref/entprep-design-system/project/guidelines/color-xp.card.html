<!-- @dsCard group="Colors" viewport="700x150" name="XP Reward" subtitle="Yellow reward family — stars, XP, the hero card" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 24px; margin: 0; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .sw { border: 2px solid var(--ink); border-radius: var(--r-12); overflow: hidden; box-shadow: var(--shadow-rest); }
  .chip { height: 64px; }
  .meta { padding: 8px 10px; background: var(--surface-card); }
  .name { font-family: var(--ff-display); font-weight: 700; font-size: 12px; letter-spacing: -0.01em; }
  .hex { font-family: var(--ff-mono); font-size: 10px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.04em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--xp)"></div><div class="meta"><div class="name">xp</div><div class="hex">#FFC233 · reward</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--xp-soft)"></div><div class="meta"><div class="name">xp-soft</div><div class="hex">#FFDF5E</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--xp-softer)"></div><div class="meta"><div class="name">xp-softer</div><div class="hex">#FFF1B8 · hero card</div></div></div>
  </div>
</body>
</html>

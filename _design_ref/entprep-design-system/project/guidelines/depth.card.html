<!-- @dsCard group="Spacing" viewport="700x200" name="Depth — stamped shadows" subtitle="Hard shadows only, no blur. Rest 0 3px / hero 0 5px / CTA 0 6px" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 30px 26px; margin: 0; }
  .row { display: flex; gap: 26px; align-items: flex-start; }
  .item { display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .box { width: 120px; height: 56px; background: var(--surface-card); border: 2px solid var(--ink); border-radius: var(--r-12); display: flex; align-items: center; justify-content: center; font-family: var(--ff-mono); font-size: 11px; font-weight: 700; }
  .cta { background: var(--streak); color: #fff; }
  .n { font-family: var(--ff-mono); font-size: 10px; color: var(--text-muted); letter-spacing: 0.05em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:0 3px 0 0 var(--ink)">rest</div><div class="n">0 3px 0 0 ink</div></div>
    <div class="item"><div class="box" style="box-shadow:0 5px 0 0 var(--ink)">hero</div><div class="n">0 5px 0 0 ink</div></div>
    <div class="item"><div class="box cta" style="box-shadow:0 6px 0 0 var(--ink)">CTA</div><div class="n">0 6px 0 0 ink</div></div>
    <div class="item"><div class="box" style="box-shadow:0 1px 0 0 var(--ink);transform:translateY(4px)">press</div><div class="n">0 1px · sinks 4px</div></div>
  </div>
</body>
</html>

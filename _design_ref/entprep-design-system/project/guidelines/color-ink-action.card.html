<!-- @dsCard group="Colors" viewport="700x150" name="Ink & Action" subtitle="Ink is theme-invariant; streak is the only action color" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 24px; margin: 0; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .sw { border: 2px solid var(--ink); border-radius: var(--r-12); overflow: hidden; box-shadow: var(--shadow-rest); }
  .chip { height: 64px; }
  .meta { padding: 8px 10px; background: var(--surface-card); }
  .name { font-family: var(--ff-display); font-weight: 700; font-size: 12px; letter-spacing: -0.01em; }
  .hex { font-family: var(--ff-mono); font-size: 10px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.04em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--ink)"></div><div class="meta"><div class="name">ink</div><div class="hex">#0F0F10 · borders</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--streak)"></div><div class="meta"><div class="name">streak</div><div class="hex">#FF5A36 · action</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--streak-deep)"></div><div class="meta"><div class="name">streak-deep</div><div class="hex">#E84320 · pressed</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--streak-soft)"></div><div class="meta"><div class="name">streak-soft</div><div class="hex">#FFD9CE · splash</div></div></div>
  </div>
</body>
</html>

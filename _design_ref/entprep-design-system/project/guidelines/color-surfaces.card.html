<!-- @dsCard group="Colors" viewport="700x190" name="Surfaces — Light & Dark" subtitle="Warm cream paper vs ink-black; cards stay solid in dark" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 24px; margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .pane { border: 2px solid var(--ink); border-radius: var(--r-16); padding: 18px; }
  .lbl { font-family: var(--ff-mono); font-size: 10px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 12px; }
  .card { padding: 14px; }
  .ct { font-family: var(--ff-display); font-weight: 700; font-size: 13px; }
  .cs { font-family: var(--ff-mono); font-size: 10px; margin-top: 4px; letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="pane" style="background:#FBF6EC">
    <div class="lbl" style="color:#6B675E">Light · cream</div>
    <div class="card" style="background:#FFFFFF;border:2px solid #0F0F10;border-radius:12px;box-shadow:0 3px 0 0 #0F0F10">
      <div class="ct" style="color:#0F0F10">--surface-card</div>
      <div class="cs" style="color:#6B675E">#FFFFFF on #FBF6EC</div>
    </div>
  </div>
  <div class="pane" style="background:#0B0B12;border-color:#000">
    <div class="lbl" style="color:#ABA8B6">Dark · ink-black</div>
    <div class="card" style="background:#22222E;border:2px solid #000;border-radius:12px;box-shadow:0 3px 0 0 #000">
      <div class="ct" style="color:#F5F2EA">--surface-card</div>
      <div class="cs" style="color:#ABA8B6">SOLID #22222E (not rgba)</div>
    </div>
  </div>
</body>
</html>

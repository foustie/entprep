<!-- @dsCard group="Spacing" viewport="700x160" name="Radii" subtitle="R = 8 / 12 button / 16 card / 18 hero / 24 / pill chip" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 26px; margin: 0; }
  .row { display: flex; gap: 18px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 70px; height: 56px; background: var(--surface-card); border: 2px solid var(--ink); box-shadow: var(--shadow-rest); }
  .n { font-family: var(--ff-mono); font-size: 11px; font-weight: 700; }
  .sub { font-family: var(--ff-mono); font-size: 9px; color: var(--text-muted); letter-spacing: 0.05em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:8px"></div><div class="n">8</div></div>
    <div class="item"><div class="box" style="border-radius:12px"></div><div class="n">12</div><div class="sub">button</div></div>
    <div class="item"><div class="box" style="border-radius:16px"></div><div class="n">16</div><div class="sub">card</div></div>
    <div class="item"><div class="box" style="border-radius:18px"></div><div class="n">18</div><div class="sub">hero</div></div>
    <div class="item"><div class="box" style="border-radius:24px"></div><div class="n">24</div></div>
    <div class="item"><div class="box" style="border-radius:100px"></div><div class="n">pill</div><div class="sub">chip</div></div>
  </div>
</body>
</html>
